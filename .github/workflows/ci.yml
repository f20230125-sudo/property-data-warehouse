name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Exits non-zero if any of the data-quality checks in sql/07 fails.
      - name: Build the warehouse and run the quality checks
        run: python build.py

      - name: Run the analytical queries
        run: python run_queries.py
